# Electrical acceptance contract: FE-AAF-001, single-supply anti-alias front end for a 3.3 V SAR ADC.
#
# Every item carries:
#   kind:   requirement (what the board must do) | assumption (stated input we do NOT control) | derived (computed from others)
#   verify: sim | analysis | inspection | physical     (physical = cannot be established without hardware)
#   model_coverage: what the planned simulation can and cannot see for this item
# The design agent / generator MUST NOT edit this file; it is owned by the evaluator (see docs/ownership.md).
schema_version: 1
id: FE-AAF-001
title: Anti-alias front end, 3.3 V SAR ADC, 50 Hz-1 kHz band
status: draft-for-reference-design      # reference design is MANUALLY authored, not agent output
revisions:
  - rev: 2
    date: 2026-11-17
    change: "REQ-STAB redefined (AC peaking vs ideal instead of step overshoot <= 10 %)"
    reason: "3rd-order Butterworth has ~8 % inherent step overshoot, so the original criterion conflated filter shape with op-amp stability"
    made_before_any_simulation_result: true
    status: "IN FORCE (author-made; rev-1 text preserved in git b7660b6)"
  - rev: 3
    date: 2026-11-17
    change: "PROPOSED: REQ-STAB comparison floor - ideal curve floored at -90 dB before comparing"
    status: "PROPOSED, NOT APPROVED. Rev 2 stays in force and its failure stands until a human approves rev 3."
    reason: >-
      The rev-2 metric reported 46.5 dB of 'peaking' at 10 MHz (pre-patch design) where simulated gain was -178.9 dB and ideal -225.5 dB.
      CORRECTION made during review: an earlier wording called these levels numerical noise; that is NOT supported. Solver-option tests
      (gmin 1e-15 / 1e-9, reltol 1e-6) leave the levels unchanged to 0.1 dB (runs/ref/review/stab/numerics.py), so they are deterministic
      model behaviour (finite op-amp gain/output impedance vs an ideal curve that falls much deeper). The justification for a floor is
      irrelevance, not noise: levels below -90 dB (0.03 mV per V) cannot matter to a 0.8 mV LSB.
    made_after_result: true
    original_rev2_result: >-
      failed, excess 46.54 dB at 10 MHz on the pre-patch design (preserved: runs/ref/repair-0001/before/sim_results_rev2.json);
      52.9 dB on the final design (runs/ref/baseline/record.json, check REQ-STAB)
    independence_caveat: "revised by the same party that authored the design; needs human review before the contract is frozen"

interfaces:
  J1: {pins: [AIN, GND, +5V], role: "signal in (AC), ground, supply"}
  J2: {pins: [AOUT, GND, VREF], role: "to ADC input, ground, ADC reference sense (3.3 V)"}

conditions:
  supply_5v:      {nominal: 5.0, min: 4.75, max: 5.25, unit: V, kind: assumption, verify: sim}
  vref:           {nominal: 3.3, min: 3.267, max: 3.333, unit: V, kind: assumption, verify: sim, note: "supplied by the ADC board on J2.VREF, +/-1 %"}
  temperature:    {nominal: 25, unit: degC, kind: assumption, verify: physical, model_coverage: "NOT covered: ngspice models run at nominal temperature; no temperature requirement is claimed as met"}

signal_source:
  band_hz:        {lo: 50, hi: 1000, kind: assumption, verify: analysis, note: "mains-hum-to-1 kHz sensor/line band"}
  amplitude_peak_V: {max: 1.0, kind: assumption, verify: sim}
  source_impedance_ohm: {min: 0, max: 100, kind: assumption, verify: sim, note: "buffered/line-driver source; adds in series with the 10 k input resistor"}
  coupling: AC (input capacitor; DC blocked)
  interferer:
    description: out-of-band tone (e.g. switching noise) at or above fs - f_band_hi
    amplitude_peak_V_at_input: 0.5
    kind: assumption
    verify: sim

adc_model:     # GENERIC assumed SAR input, not a specific part. Real ADC kickback needs physical test.
  resolution_bits: 12
  range_V: [0.0, 3.3]
  sample_rate_hz: 20000
  c_sample_pF: 10
  r_switch_ohm: 200
  t_acquire_us: 1.0
  previous_sample_worst_case: "opposite full-scale excursion (step = 2 x output peak)"
  kind: assumption
  verify: sim
  model_coverage: "switched-capacitor charge kickback modelled as ideal switch + Cs; real ADC input leakage, kickback glitch energy and reference noise NOT modelled"

requirements:
  - id: REQ-GAIN
    text: "Mid-band gain at 400 Hz, source impedance 100 ohm, is 1.30 V/V +/-5 %."
    kind: requirement
    check: {metric: gain_400hz_V_per_V, min: 1.235, max: 1.365}
    verify: sim
    rationale: "1.0 Vpk input -> 1.30 Vpk output about VREF/2 = 1.65 V: top 2.95 V, bottom 0.35 V, i.e. uses ~79 % of the ADC range yet leaves >=0.25 V to the 3.2 V / 0.1 V limits across tolerance."
  - id: REQ-FLAT
    text: "Gain at every frequency 50 Hz-1 kHz is within +/-0.5 dB of the 400 Hz gain."
    kind: requirement
    check: {metric: passband_flatness_dB_max_abs, max: 0.5}
    verify: sim
  - id: REQ-ALIAS
    text: "For a 0.5 Vpk input tone at any frequency from 19 kHz to 1 MHz, the output amplitude is <= 1 LSB (0.806 mV peak), i.e. absolute gain <= -55.8 dB."
    kind: requirement
    check: {metric: stopband_abs_gain_dB_max_19k_to_1M, max: -55.8}
    verify: sim
    derivation: "alias band = [fs - f_hi, fs + f_hi] = [19, 21] kHz and above; 20*log10(0.8057e-3/0.5)"
    model_coverage: "Includes op-amp finite GBW and output impedance IF the vendor macro-model captures them; above ~1 MHz not claimed. Layout coupling/ground bounce is physical-only."
  - id: REQ-BIAS
    text: "Quiescent output DC level equals VREF/2 within +/-10 mV (0.6 %) for any supply and VREF in range, with worst-case op-amp offset."
    kind: requirement
    check: {metric: output_dc_error_mV_max_abs, max: 10}
    verify: sim
  - id: REQ-HEADROOM
    text: "At 1.0 Vpk input (50 Hz-1 kHz) the output stays within 0.10 V ... 3.20 V in all corners; no clipping."
    kind: requirement
    check: {metric: output_min_V_min, min: 0.10, extra: {metric: output_max_V_max, max: 3.20}}
    verify: sim
  - id: REQ-ZIN
    text: "Input impedance magnitude from 50 Hz-1 kHz is >= 10 kohm."
    kind: requirement
    check: {metric: zin_min_ohm, min: 10000}
    verify: sim
  - id: REQ-SETTLE
    text: "Charge-bucket load settling: with the ADC model sample cap pre-charged to the opposite full-scale level, the voltage on the sample cap at the end of the 1 us acquisition is within 1/2 LSB (0.403 mV) of the settled value."
    kind: requirement
    check: {metric: acquisition_error_mV_max_abs, max: 0.403}
    verify: sim
    model_coverage: "Generic switched-cap load; real ADC differs (see adc_model)."
  - id: REQ-STAB
    # IN FORCE: revision 2 (approved only in the sense of being the last committed-by-author version). Revision 3 below is PROPOSED, NOT APPROVED.
    text: "No unintended peaking: at every frequency from 10 Hz to 10 MHz the simulated AOUT gain does not exceed the ideal-op-amp prediction of the same component values by more than 3 dB (catches op-amp/cap-load instability that the ideal model cannot show). Transient step stability is NOT tested."
    kind: requirement
    check: {metric: peaking_above_ideal_dB_max_unfloored, max: 3.0}
    verify: sim
    model_coverage: "Depends on the vendor model's output impedance and phase behaviour with the 100 ohm + 1 nF load. Time-domain ringing/overshoot of the op-amp output stage is not separately tested (outcome not_tested for that aspect)."
    superseded_rev1_text: "Both op-amp outputs are stable (no sustained oscillation) with the 100 ohm + 1 nF output network; transient step overshoot at AOUT <= 10 % of step.  [replaced before any simulation result: 3rd-order Butterworth inherently overshoots ~8 %; text preserved in git b7660b6]"
    proposed_revision_3:
      status: PROPOSED - NOT APPROVED (needs human review)
      text: "As revision 2, but the ideal curve is floored at -90 dB before comparing: gain must not exceed max(ideal, -90 dB) + 3 dB."
      check: {metric: peaking_above_ideal_dB_max, max: 3.0, ideal_floor_dB: -90}
      reported_as: REQ-STAB-R3-AC-PEAKING-PROPOSED

  - id: REQ-IQ
    text: "Total quiescent supply current <= 1.0 mA at 5 V."
    kind: requirement
    check: {metric: iq_mA_max, max: 1.0}
    verify: sim
    model_coverage: "Only if the op-amp macro-model includes supply current; otherwise datasheet value is used (verify: analysis)."
  - id: REQ-NOISE
    text: "Integrated output noise 1 Hz-20 kHz <= 0.25 LSB rms (0.2 mV)."
    kind: requirement
    check: {metric: output_noise_mV_rms, max: 0.2}
    verify: sim
    model_coverage: "Only if the model carries noise sources (often it does not). Otherwise outcome = not_tested, never passed."
  - id: REQ-ERC-DRC
    text: "KiCad ERC: 0 errors, 0 warnings that are not individually waived in writing. KiCad DRC incl. schematic parity: 0 violations, 0 unconnected items, 0 parity issues."
    kind: requirement
    verify: inspection
    note: "JSON parity entries are severity=warning, so ALL sections of the DRC report are counted."
  - id: REQ-PINS
    text: "Pin-function audit: every active/polarised part's manufacturer pin function = symbol pin function = footprint pad number, against the transcribed datasheet table (independent of the netlist)."
    kind: requirement
    verify: inspection
  - id: REQ-BOM
    text: "Every BOM line has a manufacturer part number; every active part has a recorded datasheet revision."
    kind: requirement
    verify: inspection
  - id: REQ-MFG
    text: "2-layer, <= 40 x 30 mm, min track/space 0.15 mm, min drill 0.3 mm, 0.6 mm via; Gerber/drill/position files generated and rendered."
    kind: requirement
    verify: inspection

tolerance_model:
  resistors: {series: E96, tolerance_pct: 1.0, distribution: uniform_within_tolerance, kind: assumption,
              note: "uniform is deliberately conservative (no Gaussian guarantee from manufacturers)"}
  bias_divider_resistors: {series: E96, tolerance_pct: 0.1}
  filter_capacitors: {dielectric: C0G, tolerance_pct: 5.0, distribution: uniform_within_tolerance}
  coupling_capacitor: {dielectric: X7R, tolerance_pct: 20.0, extra_dc_bias_loss_pct: 20, note: "worst-case effective value in [0.6, 1.2] x nominal"}
  opamp: {offset_and_bias: "datasheet MAX values as corner values, not typical", note: "model must reproduce them or the corner is analysis-only"}
  yield_criterion:
    monte_carlo: {samples: 2000, seed: 20261117}
    pass_if: ">= 99 % of samples meet every sim requirement AND all supply/VREF corner combinations meet them"
    statistical_caveat: "a Monte Carlo pass shows the tolerance model passes, not that a lot of boards will"

physical_only:   # nothing here is claimed by any simulation in this repository
  - "assembled-board frequency response and noise"
  - "real ADC kickback / reference behaviour"
  - "ESD, input overvoltage beyond the +/-3.3 V analysis case, hot-plug"
  - "temperature drift; X7R dc-bias and aging"
  - "layout-induced coupling, ground bounce, EMC"
