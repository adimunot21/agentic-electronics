# (none is legitimately obtainable offline; see docs/research/orderability.md). Every entry carries its source, retrieval date, what it proves and caveats.
schema_version: 1
generated: 2026-11-20
families:
  - family_id: yageo_rc_l_0603_1pct
    manufacturer: Yageo
    mpn_template: "RC0603FR-07{code}L"        # F = +-1 %, R = paper tape, 07 = 7 inch reel, L = lead free (Yageo RC_L ordering information, same sheet)
    kind: resistor
    value_series: E96
    value_min: 1.0                             # ohm; RC0603 1 % (E24/E96) resistance range, lower limit
    value_max: 1.0e7                           # ohm; RC0603 1 % (E24/E96) resistance range, upper limit (10 Mohm, inclusive)
    tolerance_pct: 1.0
    package: "0603"
    basis: "manufacturer datasheet range statement"
    source:
      url: https://www.yageogroup.com/content/datasheet/asset/file/PYU-RC_GROUP_51_ROHS_L
      doc_id: "Yageo RC_L series data sheet, PYu-RC_Group_51_RoHS_L"
      revision: "Product specification - November 14, 2025 V.14"
      sha256: 7b6f0ae72708ca4b38126f84b5407a3e970a94cb60bc1a0afdaeb25a23d839bb
      retrieved: 2026-11-20
    proves:
      - "Table 2 of the V.14 data sheet lists RC0603 (1/10 W) with 1% (E24/E96) resistance range 1 ohm <= R <= 10 Mohm; the global part number scheme RC0603 F R 07 <value> L is the series' ordering scheme."
      - "The same 1 ohm - 10 Mohm 1 % range appears in the older V.11 (July 2020) copy and in the V.4 (2009) copy already in evidence/datasheets/yageo_rc (sha256 419181287881...)."
    does_not_prove:
      - "stock at any distributor, price, minimum order quantity or lead time"
      - "that each individual E96 value is currently in production or Active (the data sheet states a range for the series, not a per-value orderable list)"
      - "lifecycle status (no EOL/NRND information is in the data sheet)"
      - "that any specific MPN is listed by any particular distributor"
    caveats:
      - "Catalogue-range coverage for E96 values: the data sheet says E24/E96; its note about 'E24 exception values 10/11/13/15/20/75' concerns marking codes, not orderability."
      - "Data sheet is a manufacturer document hosted by the manufacturer; it may be superseded by a later revision at any time."
      - "Voltage rating differs between data sheet revisions (V.4: 50 V working; V.11/V.14: 75 V); irrelevant to orderability."
  - family_id: kemet_c0805c_c0g_50v_5pct
    manufacturer: Kemet
    mpn_template: "C0805C{code}J5GACTU"      # C0805C = 0805 standard C-series, J = +-5 %, 5 = 50 VDC, G = C0G, A = n/a, C = 100 % matte Sn, TU = packaging (code = 2 significant digits + zeros, in pF)
    kind: capacitor
    voltage_v: 50
    dielectric: C0G
    tolerance_pct: 5.0
    package: "0805"
    basis: "manufacturer datasheet per-value capacitance table (0805, 50 V column, J tolerance offered)"
    # Values (pF) with a populated 0805 / 50 V cell and J (+-5 %) in the tolerance column of Table 1A. Footnote of the table: "Capacitance range Includes E24 decade values only."
    # Below 10 pF the table offers only B/C/D (pF) tolerances, so no J-tolerance part exists there. 10 pF - 9.1 nF: every E24 value; 10 nF decade: only 10, 12, 15, 18, 22 nF are listed
    # (11, 13, 16, 20 nF are NOT listed: unknown, not proven absent). 27 nF and above: no 0805 / 50 V cell in this revision.
    listed_values_pf: [10, 11, 12, 13, 15, 16, 18, 20, 22, 24, 27, 30, 33, 36, 39, 43, 47, 51, 56, 62, 68, 75, 82, 91, 100, 110, 120, 130, 150, 160, 180, 200, 220, 240, 270, 300, 330, 360, 390, 430, 470, 510, 560, 620, 680, 750, 820, 910, 1000, 1100, 1200, 1300, 1500, 1600, 1800, 2000, 2200, 2400, 2700, 3000, 3300, 3600, 3900, 4300, 4700, 5100, 5600, 6200, 6800, 7500, 8200, 9100, 10000, 12000, 15000, 18000, 22000]
    source:
      url: https://extranet.mandieselturbo.com/electronics/datasheets/Kemet/MLCC_SMD/C1003_C0G_2016.pdf
      doc_id: "KEMET C1003_C0G, 'C0G Dielectric, 10 - 250 VDC (Commercial Grade)', Table 1A"
      revision: "C1003_C0G, footer date 7/21/2016 (PDF created 2016-10-14); third-party hosted copy of the manufacturer document, NOT the current revision"
      sha256: 75db98383c378259270ea98a0e74f33e37a5fc315de897df8858ae654d5b2d34
      retrieved: 2026-11-20
      quote: '"Capacitance range Includes E24 decade values only." (KEMET C1003_C0G, Table 1A footnote)'
    proves:
      - "In the 7/21/2016 revision of KEMET's C0G commercial data sheet, each listed value (pF) has a populated C0805C 50 V cell with +-5 % (J) offered, i.e. a catalogue entry existed for C0805C<code>J5GACTU."
      - "The four ordering codes already evidenced by 2026-11-17 Kemet spec sheets (330 pF, 1 nF, 5.6 nF, 18 nF) all appear in this table, so the table agrees with the newer evidence."
    does_not_prove:
      - "stock at any distributor, price, minimum order quantity or lead time"
      - "that a listed value is Active or in production in 2026 (the 2016 table says nothing about lifecycle; it is ten years old)"
      - "that an UNLISTED value (e.g. 11 nF, 27 nF) does not exist: later revisions may have extended the 0805 / 50 V range, so unlisted means unknown"
      - "the packaging suffix TU (7-inch reel) is available for each value"
    caveats:
      - "Document is a 2016 revision, hosted by a third party (a customer's extranet); the current KEMET revision (content.kemet.com) could not be read: its TLS certificate was expired and was not bypassed."
      - "Table cells carry chip-thickness codes (DN, DP, DE, ...) only; they are not read as availability."
      - "The table was read by extracting word positions (x-coordinate of the 0805 / 50 V column) from the PDF, not by eye; footnote markers (*) group some rows (110-180 pF, 200-270 pF), expanded here as E24 values."
