[project]
name = "agentic-electronics"
version = "0.0.1"
description = "Research harness for agentic electronics design: requirement -> parts -> schematic -> sim -> PCB -> checks -> release"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml==6.0.2",
  "numpy==2.1.3",
  "sympy==1.13.3",
  "scipy==1.14.1",
  "matplotlib==3.9.2",
]

[project.scripts]
ae = "ae.cli:main"

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ae"]

[tool.pytest.ini_options]
markers = ["integration: invokes the real tools in the pinned image (needs docker)"]
testpaths = ["tests"]
